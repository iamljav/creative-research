<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Luca Vergano</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Creative research not work-related by Luca Vergano" />
    <link rel="me" href="https://lucavergano.com" />
    <link rel="icon" type="image/png" href="assets/img/favicon.png" />
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "@id": "https://lucavergano.com/#luca-vergano",
      "name": "Luca Vergano",
      "alternateName": "LJAV",
      "url": "https://lucavergano.com",
      "sameAs": [
        "https://lucavergano.com",
        "https://iamljav.xyz",
        "https://www.linkedin.com/in/lucavergano",
        "https://www.instagram.com/iamljav/"
      ]
    }
    </script>

    <style>
        /* ── FONTS ───────────────────────────────────────────── */
        @font-face {
            font-family: 'IBM Plex Mono';
            src: url('assets/img/IBMPlexMono-Regular.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'IBM Plex Mono Light';
            src: url('assets/img/IBMPlexMono-Light.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        /* ── RESET ───────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
        }

        /* ── POSTS AREA ──────────────────────────────────────── */
        #posts-wrap {
            width: 92%;
            max-width: 1200px;
            margin: 40px auto 0 auto;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 10px;
            line-height: 1.6;
        }

        #posts-wrap a {
            color: #000000;
            text-decoration: underline;
        }

        /* ── SITE EMBED — live website ───────────────────────── */
        .stage-slide.is-site iframe {
            border: 1px solid #000;
        }

        /* ── POST CAPTION ────────────────────────────────────── */
        .post-caption {
            font-size: 10px;
            font-family: Helvetica, Arial, sans-serif;
            color: #000;
            margin-top: 6px;
            line-height: 1.5;
        }

        .post-caption em {
            font-style: normal;
            font-family: 'IBM Plex Mono Light', monospace;
            text-transform: lowercase;
            font-size: 9px;
            color: #666666;
        }

        .post-caption em a {
            color: inherit;
        }

        /* ── TITLE TRIGGER ───────────────────────────────────── */
        .post-title-trigger {
            cursor: pointer;
            text-decoration: none;
            border-bottom: 1px solid #000;
        }

        .post-title-trigger:hover {
            opacity: 0.5;
        }

        /* ── INFO MODAL ──────────────────────────────────────── */
        .info-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 9998;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .info-overlay.active { display: flex; }

        .info-box {
            background: #fff;
            color: #000;
            max-width: 480px;
            width: 100%;
            padding: 28px 32px;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 11px;
            line-height: 1.7;
            position: relative;
        }

        .info-box-title {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 0 0 14px 0;
        }

        .info-box-body {
            margin: 0;
        }

        .info-box-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 14px;
            font-weight: 300;
            cursor: pointer;
            color: #000;
            line-height: 1;
            opacity: 0.4;
            padding: 4px;
        }

        .info-box-close:hover { opacity: 1; }

        .info-box-link {
            display: none;
            margin-top: 14px;
            font-size: 10px;
            font-family: Helvetica, Arial, sans-serif;
            color: #000;
            text-decoration: underline;
            word-break: break-all;
        }

        .info-box-link.visible { display: block; }

        /* ── STAGE CAROUSEL (top-level project navigator) ────── */
        .stage-outer {
            position: relative;
        }

        .stage-wrap {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
            background: #000;
        }

        .stage-slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            z-index: 1;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }

        .stage-slide.active {
            opacity: 1;
            z-index: 2;
            visibility: visible;
        }

        .stage-slide iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .stage-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
            cursor: zoom-in;
        }

        .stage-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.35);
            border: none;
            cursor: pointer;
            padding: 10px 14px;
            z-index: 5;
            opacity: 0.5;
            transition: opacity 0.2s ease;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 16px;
            font-weight: 300;
            color: #fff;
            line-height: 1;
        }

        .stage-btn:hover { opacity: 0.9; }
        .stage-btn.prev  { left: 8px; }
        .stage-btn.next  { right: 8px; }

        /* ── STAGE CAPTION ───────────────────────────────────── */
        #stage-caption {
            margin-top: 6px;
        }

        #stage-caption strong {
            text-transform: uppercase;
            font-weight: normal;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: #666666;
        }

        .post-caption strong a {
            color: inherit;
        }

        /* ── TILES ROW ───────────────────────────────────────── */
        .tiles-row {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 4px;
        }

        .tile {
            flex: 1 1 0;
            min-width: 120px;
            height: 63px;
            background: #fff;
            border: 1px solid #000;
            opacity: 0.4;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8px 10px;
            font-family: Helvetica, Arial, sans-serif;
        }

        .tile:hover { opacity: 0.7; }

        .tile.active {
            opacity: 1;
            border-width: 2px;
        }

        .tile-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #000;
            font-family: 'IBM Plex Mono', monospace;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        /* ── PER-POST MULTI-IMAGE CAROUSEL (unchanged) ───────── */
        .carousel-wrap {
            position: relative;
            width: 100%;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.4s ease;
            will-change: transform;
        }

        .carousel-slide {
            min-width: 100%;
            width: 100%;
            flex-shrink: 0;
        }

        .carousel-slide img {
            width: 100%;
            height: auto;
            display: block;
            cursor: zoom-in;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            z-index: 10;
            opacity: 0.25;
            transition: opacity 0.2s ease;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 14px;
            font-weight: 300;
            color: #000;
            line-height: 1;
        }

        .carousel-btn:hover { opacity: 0.6; }
        .carousel-btn.prev  { left: 4px; }
        .carousel-btn.next  { right: 4px; }

        .carousel-counter {
            text-align: right;
            font-size: 8px;
            font-family: Helvetica, Arial, sans-serif;
            color: #999;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* ── LIGHTBOX ────────────────────────────────────────── */
        .lightbox-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.88);
            z-index: 9999;
            cursor: zoom-out;
            align-items: center;
            justify-content: center;
        }

        .lightbox-overlay.active { display: flex; }

        .lightbox-overlay img {
            max-width: 92vw;
            max-height: 92vh;
            object-fit: contain;
            display: block;
        }

        /* ── MOBILE ──────────────────────────────────────────── */
        @media screen and (max-width: 768px) {
            #posts-wrap {
                width: 90%;
                margin-top: 24px;
            }

            #posts-wrap { font-size: 12px; }

            .info-box {
                padding: 20px 20px;
            }

            .tile {
                min-width: 90px;
                height: 49px;
            }

            .stage-btn {
                padding: 8px 10px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<!-- POSTS -->
<div id="posts-wrap">
    <div class="stage-outer">

        <!-- STAGE: shows the active project's iframe/image. All slides stay
             mounted at all times (visibility/opacity toggled, never
             removed/re-rendered) so the conspiracytraces.org iframe below
             never gets unmounted or reloaded when switching slides. -->
        <div class="stage-wrap" id="stage">

            <!-- SLIDE: conspiracy traces | live site embed -->
            <div class="stage-slide is-site active" data-label="a conspiracy theory of everything">
                <iframe
                    src="https://conspiracytraces.org"
                    title="a conspiracy theory of everything">
                </iframe>
                <template class="stage-caption-src">
                    <strong><a href="https://conspiracytraces.org" target="_blank" rel="noopener">a conspiracy theory of everything</a>: a real time exploration on how correlations become inference</strong> &nbsp;<em>[coding, data visualization]</em>
                </template>
            </div>

            <!-- SLIDE: oblique alphabet | anti-algorithm digital card deck -->
            <div class="stage-slide" data-label="oblique alphabet">
                <iframe
                    src="https://player.vimeo.com/video/1179281529?h=26bcd188b7&title=0&byline=0&portrait=0&badge=0&autopause=0&player_id=0&app_id=58479"
                    allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen
                    title="oblique alphabet | generative AI">
                </iframe>
                <template class="stage-caption-src">
                    <strong><a href="https://obliquealphabet.ai/" target="_blank" rel="noopener">oblique alphabet</a>: a digital card deck to resist algorithms</strong> &nbsp;<em>[generative AI, inspired by Brian Eno and Gilles Deleuze]</em>
                </template>
            </div>

            <!-- SLIDE: self portrait | DNA generated video, 2024 -->
            <div class="stage-slide" data-label="self portrait">
                <iframe
                    src="https://player.vimeo.com/video/1197362495?h=d30c981759&title=0&byline=0&portrait=0&badge=0&autopause=0&player_id=0&app_id=58479"
                    allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen
                    title="self portrait | mitochondrial dna electrophoresis, generative audio VST, digital manipulation">
                </iframe>
                <template class="stage-caption-src">
                    <strong>self portrait: an investigation of identity and perception</strong> &nbsp;<em>[mitochondrial dna electrophoresis, generative audio VST, digital manipulation]</em>
                </template>
            </div>

            <!-- ADD NEW PROJECTS ABOVE THIS LINE (inside .stage-wrap) -->

            <button class="stage-btn prev" id="stage-prev" aria-label="Previous project">&#8249;</button>
            <button class="stage-btn next" id="stage-next" aria-label="Next project">&#8250;</button>
        </div>

        <!-- shared caption for the active project -->
        <p class="post-caption" id="stage-caption"></p>

        <!-- thumbnail navigation, one tile per project, filled in by JS -->
        <div class="tiles-row" id="stage-tiles"></div>

    </div>
</div>

<!-- INFO MODAL -->
<div class="info-overlay" id="info-overlay">
    <div class="info-box" id="info-box">
        <button class="info-box-close" id="info-box-close" aria-label="Close">&#x2715;</button>
        <p class="info-box-title" id="info-box-title"></p>
        <p class="info-box-body" id="info-box-body"></p>
        <a class="info-box-link" id="info-box-link" href="#" target="_blank" rel="noopener noreferrer"></a>
    </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox-overlay" id="lightbox">
    <img id="lightbox-img" src="" alt="">
</div>

<script>
    // ── INFO MODAL ────────────────────────────────────────────
    var infoOverlay = document.getElementById('info-overlay');
    var infoBox     = document.getElementById('info-box');
    var infoTitle   = document.getElementById('info-box-title');
    var infoBody    = document.getElementById('info-box-body');
    var infoClose   = document.getElementById('info-box-close');
    var infoLink    = document.getElementById('info-box-link');

    document.addEventListener('click', function(e) {
        var trigger = e.target.closest('.post-title-trigger');
        if (trigger) {
            e.preventDefault();
            infoTitle.textContent = trigger.dataset.title || '';
            infoBody.innerHTML = '';
            (trigger.dataset.description || '').split('||').forEach(function(para) {
                var p = document.createElement('p');
                p.style.margin = '0 0 10px 0';
                p.textContent = para.trim();
                infoBody.appendChild(p);
            });
            var link = trigger.dataset.link || '';
            if (link) {
                infoLink.href        = link;
                infoLink.textContent = link;
                infoLink.classList.add('visible');
            } else {
                infoLink.classList.remove('visible');
            }
            infoOverlay.classList.add('active');
        }
    });

    infoOverlay.addEventListener('click', function(e) {
        if (!infoBox.contains(e.target)) {
            infoOverlay.classList.remove('active');
        }
    });

    infoClose.addEventListener('click', function() {
        infoOverlay.classList.remove('active');
    });

    // ── LIGHTBOX ──────────────────────────────────────────────
    var overlay = document.getElementById('lightbox');
    var lbImg   = document.getElementById('lightbox-img');

    document.addEventListener('click', function(e) {
        var img = e.target.closest('#posts-wrap img');
        var onNavControl = e.target.closest('.carousel-btn') || e.target.closest('.stage-btn') || e.target.closest('.tile');
        if (img && !onNavControl && !img.dataset.noLightbox) {
            lbImg.src = img.src;
            lbImg.alt = img.alt || '';
            overlay.classList.add('active');
        }
    });

    overlay.addEventListener('click', function() {
        overlay.classList.remove('active');
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            overlay.classList.remove('active');
            infoOverlay.classList.remove('active');
        }
    });

    // ── STAGE CAROUSEL (top-level project navigator) ───────────
    (function() {
        var stage   = document.getElementById('stage');
        var slides  = Array.prototype.slice.call(stage.querySelectorAll('.stage-slide'));
        var total   = slides.length;
        var tilesEl = document.getElementById('stage-tiles');
        var capEl   = document.getElementById('stage-caption');
        var prevBtn = document.getElementById('stage-prev');
        var nextBtn = document.getElementById('stage-next');
        var current = 0;

        var tiles = slides.map(function(slide, i) {
            var tile = document.createElement('button');
            tile.className = 'tile';
            tile.type = 'button';
            tile.setAttribute('aria-label', 'Show project: ' + (slide.dataset.label || (i + 1)));

            var label = document.createElement('span');
            label.className = 'tile-label';
            label.textContent = slide.dataset.label || ('project ' + (i + 1));

            tile.appendChild(label);
            tile.addEventListener('click', function() { goTo(i); });
            tilesEl.appendChild(tile);
            return tile;
        });

        function goTo(index) {
            current = (index + total) % total;

            slides.forEach(function(slide, i) {
                slide.classList.toggle('active', i === current);
            });
            tiles.forEach(function(tile, i) {
                tile.classList.toggle('active', i === current);
            });

            var capSrc = slides[current].querySelector('.stage-caption-src');
            capEl.innerHTML = '';
            if (capSrc) {
                capEl.appendChild(capSrc.content.cloneNode(true));
                capEl.querySelectorAll('a').forEach(function(a) {
                    a.setAttribute('target', '_blank');
                    a.setAttribute('rel', 'noopener noreferrer');
                });
            }
        }

        if (total > 0) {
            prevBtn.addEventListener('click', function() { goTo(current - 1); });
            nextBtn.addEventListener('click', function() { goTo(current + 1); });
            if (total <= 1) {
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
            }
            goTo(0);
        }
    })();

    // ── PER-POST MULTI-IMAGE CAROUSEL (unchanged) ──────────────
    document.querySelectorAll('.carousel-wrap').forEach(function(carousel) {
        var track  = carousel.querySelector('.carousel-track');
        var slides = carousel.querySelectorAll('.carousel-slide');
        var total  = slides.length;
        if (total <= 1) return;

        var current = 0;

        var prevBtn = document.createElement('button');
        prevBtn.className   = 'carousel-btn prev';
        prevBtn.textContent = '<';
        prevBtn.setAttribute('aria-label', 'Previous');

        var nextBtn = document.createElement('button');
        nextBtn.className   = 'carousel-btn next';
        nextBtn.textContent = '>';
        nextBtn.setAttribute('aria-label', 'Next');

        carousel.appendChild(prevBtn);
        carousel.appendChild(nextBtn);

        var counter = document.createElement('div');
        counter.className   = 'carousel-counter';
        counter.textContent = '1 / ' + total;
        carousel.parentNode.insertBefore(counter, carousel.nextSibling);

        function goTo(index) {
            current = (index + total) % total;
            track.style.transform = 'translateX(-' + (current * 100) + '%)';
            counter.textContent   = (current + 1) + ' / ' + total;
        }

        prevBtn.addEventListener('click', function() { goTo(current - 1); });
        nextBtn.addEventListener('click', function() { goTo(current + 1); });
    });
</script>

</body>
</html>
